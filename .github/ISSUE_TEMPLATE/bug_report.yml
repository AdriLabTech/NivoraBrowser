name: Bug report
description: Report a problem with Nivora Browser
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If the problem also happens in the matching
        Zen Browser release, it comes from upstream: please say so below.
        Do not include passwords, cookies, session tokens or profile files.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps. A fresh, disposable profile is the best way to check.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nivora version
      description: From the About dialog, or `nivora --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Distribution, desktop and session type
      description: For example "Arch Linux, Hyprland, Wayland".
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: Reproduces in upstream Zen Browser?
      options:
        - Not tested
        - "Yes"
        - "No"
    validations:
      required: true

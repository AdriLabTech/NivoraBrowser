name: Nivora checks

# Cheap static checks only. A full browser build needs ~30 GB of disk and hours of CPU, so it is
# deliberately not run on every push (docs/UPSTREAM.md, "CI levels").

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # A virtual environment: `python -I` (isolated mode) ignores packages installed with --user.
      - name: Python dependencies (Pillow, pinned)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tools/nivora/requirements.txt
      - name: Palette contrast and Nivora unit tests
        run: |
          .venv/bin/python -I tools/nivora/check_contrast.py --list
          .venv/bin/python -I -m unittest discover -s tools/nivora/tests -v
      - name: Icons contain only licensed (Phosphor) glyphs
        run: .venv/bin/python -I tools/nivora/generate_icons.py --check
      - name: Interface artwork is the generated, Mozilla-free set
        run: .venv/bin/python -I tools/nivora/generate_ui_artwork.py --check
      - name: Spring easing curves are the generated ones
        run: .venv/bin/python -I tools/nivora/generate_motion.py --check
      - name: Command registry and settings (Node)
        run: node --test tools/nivora/js-tests/*.test.mjs
      - name: ffprefs unit tests
        run: cargo test --manifest-path tools/ffprefs/Cargo.toml

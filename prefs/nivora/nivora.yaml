# Nivora's own preferences. They are listed in the central settings schema
# (src/nivora/modules/NivoraSettingsCore.mjs) so they can be exported, imported
# and reset together with the Zen preferences Nivora manages.

# Hide the interface that leads to services operated by the Zen project (the
# donate button in the Library, the link to the mods website in preferences).
# Share is not covered: it hides itself while `zen.share.base-url` is empty.
- name: nivora.ui.hide-zen-services
  value: true

# Nivora's motion: springs, staggered entrances and depth across the interface (docs/ANIMATIONS.md).
# Turning it off removes Nivora's own animations; the system's "reduce motion" setting does the same.
- name: nivora.ui.animations
  value: true

# The default background of the new tab: a total eclipse, generated by tools/nivora/generate_newtab.py and
# painted by nivora-polish.inc.css while the selected tab is the empty one. false leaves Zen's plain canvas.
- name: nivora.ui.newtab-background
  value: true

# Glass: the command palette over the new tab and the cards of the settings page show a blurred copy of the
# new tab's picture, a frosted-glass look (docs/ANIMATIONS.md section 10). false leaves them plain.
- name: nivora.ui.glass
  value: true

# The first-run tour (NivoraTutorial.sys.mjs). It is set to true when the tour ends or is skipped, so it
# starts by itself only once; Settings > Look and Feel and the command palette start it again.
- name: nivora.tutorial.seen
  value: false

# Nivora's own preferences. They are listed in the central settings schema
# (src/nivora/modules/NivoraSettingsCore.mjs) so they can be exported, imported
# and reset together with the Zen preferences Nivora manages.

# Hide the interface that leads to services operated by the Zen project (the
# donate button in the Library, the link to the mods website in preferences).
# Share is not covered: it hides itself while `zen.share.base-url` is empty.
- name: nivora.ui.hide-zen-services
  value: true

# Nivora's motion: springs, staggered entrances and depth across the interface (docs/ANIMATIONS.md).
# Turning it off removes Nivora's own animations; the system's "reduce motion" setting does the same.
- name: nivora.ui.animations
  value: true
